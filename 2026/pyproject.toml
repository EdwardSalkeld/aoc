[project]
name = "aoc-2026"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "networkx",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501: the formatter owns line length. F841: half-written solutions often hold unused locals.
ignore = ["E501", "F841"]
